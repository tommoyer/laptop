---
- name: Workstation deployment
  hosts: all
  vars_files:
    - config.yml
    - secrets.yml
    - packages.yml
  tasks:
  - name: Add Google Cloud CLI repository
    become: true
    ansible.builtin.yum_repository:
      name: google-cloud-cli
      description: Google Cloud CLI
      baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
      gpgcheck: yes
      gpgkey: https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
      enabled: yes
      state: present
      repo_gpgcheck: no

  - name: Add VSCode repository
    become: true
    ansible.builtin.yum_repository:
      name: vscode
      description: Visual Studio Code
      baseurl: https://packages.microsoft.com/yumrepos/vscode
      gpgcheck: yes
      gpgkey: https://packages.microsoft.com/keys/microsoft.asc
      enabled: yes
      state: present
      repo_gpgcheck: no

  - name: Install workstation packages
    become: true
    ansible.builtin.package:
      name: "{{ packages }}"
      state: latest

  - name: Install Browsers
    become: true
    ansible.builtin.dnf:
      name: 'https://github.com/Browsers-software/browsers/releases/latest/download/browsers.x86_64.rpm'
      state: present
      disable_gpg_check: true
  
  - name: Install flatpaks
    become: true
    community.general.flatpak:
      name: "{{ flatpaks }}"
      state: present
  
  - name: Install python packages
    community.general.pipx:
      name: "{{ item }}"
    loop: "{{ pips }}"

  - name: Install Homebrew
    become: true
    ansible.builtin.command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" --unattended
    args:
      creates: /home/linuxbrew/.linuxbrew/bin/brew

  - name: Install Homebrew packages
    become: true
    ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/brew install {{ item }}
    args:
      chdir: /home/linuxbrew/.linuxbrew/bin
    loop: "{{ homebrew_packages }}"

  - name: Configure PAM for Yubikey
    become: true
    ansible.builtin.copy:
      src: files/workstation/common-u2f
      dest: /etc/pam.d/common-u2f
  
  - name: Add Yubikey as auth option for sudo
    become: true
    ansible.builtin.lineinfile:
      path: /etc/pam.d/sudo
      insertbefore: '@include common-auth'
      line: '@include common-u2f'
  
  - name: Install udev rules
    become: true
    ansible.builtin.copy:
      src: files/workstation/70-input.rules
      dest: /etc/udev/rules.d/70-input.rules
      mode: u=rw,g=r,o=r
  
  - name: Install udev rules
    become: true
    ansible.builtin.copy:
      src: files/workstation/50-usb-power-save.rules
      dest: /etc/udev/rules.d/50-usb-power-save.rules
      mode: u=rw,g=r,o=r
  
  - name: Reload udev rules
    become: true
    ansible.builtin.command: udevadm control --reload-rules
  
  - name: Configure user
    become: true
    ansible.builtin.user:
      name: "{{ user.name }}"
      comment: "{{ user.full_name }}"
      create_home: True
      shell: /usr/bin/zsh
      state: present
  
  - name: Create application directory (1/2)
    ansible.builtin.file:
      path: ${HOME}/.local/share/applications
      state: directory
      mode: '0755'
  
  - name: Create application directory (2/2)
    ansible.builtin.file:
      path: ${HOME}/.local/share/flatpak/exports/share/applications
      state: directory
      mode: '0755'

  - name: Update list of installed applications (1/2)
    ansible.builtin.command: update-desktop-database ${HOME}/.local/share/applications
  
  - name: Update list of installed applications (2/2)
    ansible.builtin.command: update-desktop-database ${HOME}/.local/share/flatpak/exports/share/applications
      
  - name: Stow dotfiles
    stow:
      state: latest
      package: '{{ item }}'
      dir: "${HOME}/.dotfiles"
      target: '$HOME'
    loop: "{{ dotfiles }}"
    
  - name: Post-Ansible finish script
    ansible.builtin.template:
      src: templates/finish-setup.sh.j2
      dest: ${HOME}/finish-setup.sh
      mode: u=rwx,g=r,o=r

  - name: Setup .local_profile
    ansible.builtin.template:
      src: templates/local_profile.j2
      dest: ${HOME}/.local_profile
      mode: u=rwx,g=r,o=r

  - name: Setup .gitconfig.gh
    ansible.builtin.template:
      src: templates/gitconfig.gh.j2
      dest: ${HOME}/.gitconfig.gh
      mode: u=rwx,g=r,o=r
    
  - name: Copy default keyboard settings
    become: true
    ansible.builtin.copy:
      src: keyboard
      dest: /etc/default/keyboard
      mode: u=rw,g=r,o=r

